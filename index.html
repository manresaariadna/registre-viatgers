<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Registre de viatgers — El Molí de Fornells</title>
<style>
  :root{
    --paper:#EEF0E4;
    --paper-line:#DCDFCC;
    --ink:#232922;
    --ink-soft:#5B6355;
    --forest:#2E3B27;
    --rust:#A6521B;
    --rust-dark:#853E14;
    --gold:#C99A2E;
    --warn:#8B3A2A;
    --warn-bg:#F3E3DC;
    --ok:#3B6B44;
    --ok-bg:#E1EADD;
    --card:#F7F8F0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px),
      var(--paper);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
  }
  #app{max-width:560px;margin:0 auto;padding:18px 16px 60px;}
  h1,h2,h3{font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;color:var(--forest);}
  h1{font-size:22px;margin:4px 0 2px;letter-spacing:.2px;}
  .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:20px;margin-top:16px;box-shadow:0 1px 0 rgba(0,0,0,.03);}
  .muted{color:var(--ink-soft);font-size:13px;}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;color:var(--forest);}
  label .opt{font-weight:400;color:var(--ink-soft);}
  input,select,textarea{
    width:100%;padding:10px 11px;border:1px solid #C7CBB6;border-radius:7px;
    font-size:15px;background:#fff;color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{
    display:inline-block;width:100%;text-align:center;padding:12px 16px;border-radius:8px;border:none;
    font-size:15px;font-weight:700;cursor:pointer;margin-top:18px;font-family:inherit;
  }
  .btn-primary{background:var(--rust);color:#fff;}
  .btn-primary:hover{background:var(--rust-dark);}
  .btn-secondary{background:transparent;color:var(--forest);border:1.5px solid var(--forest);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--paper-line);font-weight:500;font-size:13px;padding:8px 12px;width:auto;margin-top:8px;}
  .btn-danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn);}
  .link-btn{background:none;border:none;color:var(--rust);font-weight:600;cursor:pointer;padding:0;font-size:14px;text-decoration:underline;}
  .home-choice{
    display:block;width:100%;text-align:left;padding:18px;border-radius:var(--radius);
    border:1.5px solid var(--paper-line);background:var(--card);cursor:pointer;margin-top:14px;
  }
  .home-choice:hover{border-color:var(--rust);}
  .home-choice h3{margin:0 0 4px;font-size:17px;}
  .home-choice p{margin:0;color:var(--ink-soft);font-size:13px;}
  .error{background:var(--warn-bg);color:var(--warn-dark,#6b2b1f);border:1px solid #E0BBAC;padding:10px 12px;border-radius:7px;font-size:13.5px;margin-top:12px;}
  .success{background:var(--ok-bg);color:var(--ok);border:1px solid #BCD6C0;padding:10px 12px;border-radius:7px;font-size:13.5px;margin-top:12px;}
  .stamp{
    width:112px;height:112px;border-radius:50%;border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    margin:18px auto 8px;transform:rotate(-6deg);color:var(--gold);text-align:center;
    font-family:Georgia,serif;
  }
  .stamp .code{font-size:20px;font-weight:700;letter-spacing:2px;color:var(--forest);}
  .stamp .lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
  .backrow{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .backrow button{background:none;border:none;color:var(--ink-soft);font-size:20px;cursor:pointer;padding:0 4px 0 0;}
  fieldset{border:1px solid var(--paper-line);border-radius:8px;padding:6px 14px 14px;margin-top:18px;}
  legend{font-family:Georgia,serif;color:var(--forest);font-weight:700;font-size:14px;padding:0 6px;}
  .guest-row{border:1px solid var(--paper-line);border-radius:8px;padding:10px 12px;margin-top:10px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .guest-row .name{font-weight:600;font-size:14.5px;}
  .guest-row .meta{font-size:12px;color:var(--ink-soft);}
  .pill{display:inline-block;background:var(--warn-bg);color:var(--warn);font-size:11px;padding:2px 7px;border-radius:20px;margin-left:6px;font-weight:600;}
  .res-row{border:1px solid var(--paper-line);border-radius:8px;padding:12px 14px;margin-top:10px;background:#fff;cursor:pointer;}
  .res-row:hover{border-color:var(--rust);}
  .res-row .code{font-family:Georgia,serif;font-weight:700;color:var(--forest);font-size:15px;letter-spacing:1px;}
  .checklist{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--warn);}
  .footer-note{margin-top:26px;font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.5;}
  .toggle-row{display:flex;gap:10px;margin-top:6px;}
  .toggle-row button{flex:1;padding:9px;border-radius:7px;border:1.5px solid #C7CBB6;background:#fff;font-weight:600;cursor:pointer;font-size:14px;}
  .toggle-row button.active{background:var(--forest);color:#fff;border-color:var(--forest);}
  code.mono{background:#e9e6d6;padding:1px 5px;border-radius:4px;font-size:12.5px;}
</style>
</head>

/* ---------- Storage helpers ---------- */
/* ======= CONFIGURACIÓ DE SUPABASE — edita aquestes dues línies ======= */
var SUPABASE_URL = "ENGANXA_AQUI_LA_TEVA_URL_DE_SUPABASE";       // ex: https://abcdefgh.supabase.co
var SUPABASE_ANON_KEY = "ENGANXA_AQUI_LA_TEVA_ANON_KEY";          // clau pública "anon" del projecte
/* ====================================================================== */

function storageReady(){ return /^https?:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 10; }
function storageMissingError(){ return Promise.reject(new Error("STORAGE_UNAVAILABLE")); }
function sbHeaders(extra){
  var h = { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer "+SUPABASE_ANON_KEY, "Content-Type":"application/json" };
  if(extra){ for(var k in extra){ h[k]=extra[k]; } }
  return h;
}
function sbFetch(url, opts){
  return fetch(url, opts).then(function(r){
    if(!r.ok) throw new Error("STORAGE_UNAVAILABLE");
    if(r.status===204) return null;
    return r.json();
  }, function(){ throw new Error("STORAGE_UNAVAILABLE"); });
}
function sget(key){
  if(!storageReady()) return storageMissingError();
  var url = SUPABASE_URL+"/rest/v1/kv_store?key=eq."+encodeURIComponent(key)+"&select=value";
  return sbFetch(url, { headers: sbHeaders() }).then(function(rows){
    if(!rows || !rows.length) return null;
    return { key:key, value: rows[0].value };
  }).catch(function(e){ if(e && e.message==="STORAGE_UNAVAILABLE") throw e; return null; });
}
function sset(key, val){
  if(!storageReady()) return storageMissingError();
  var url = SUPABASE_URL+"/rest/v1/kv_store";
  return sbFetch(url, {
    method:"POST",
    headers: sbHeaders({ "Prefer":"resolution=merge-duplicates" }),
    body: JSON.stringify([{ key:key, value: val }])
  }).then(function(){ return { key:key, value:val }; });
}
function sdel(key){
  if(!storageReady()) return storageMissingError();
  var url = SUPABASE_URL+"/rest/v1/kv_store?key=eq."+encodeURIComponent(key);
  return sbFetch(url, { method:"DELETE", headers: sbHeaders() }).then(function(){ return { key:key, deleted:true }; })
    .catch(function(e){ if(e && e.message==="STORAGE_UNAVAILABLE") throw e; return null; });
}
function slist(prefix){
  if(!storageReady()) return storageMissingError();
  var url = SUPABASE_URL+"/rest/v1/kv_store?key=like."+encodeURIComponent(prefix||"")+"*&select=key";
  return sbFetch(url, { headers: sbHeaders() }).then(function(rows){
    return { keys: (rows||[]).map(function(x){ return x.key; }) };
  }).catch(function(e){ if(e && e.message==="STORAGE_UNAVAILABLE") throw e; return {keys:[]}; });
}

function saveSettings(s){ return sset("settings", JSON.stringify(s)); }

function codeGen(){
  var chars = "ACDEFGHJKLMNPQRSTUVWXYZ23456789"; // sense O/0/I/1 per evitar confusions
  var out = "";
  for(var i=0;i<5;i++){ out += chars[Math.floor(Math.random()*chars.length)]; }
  return out;
}

function pad2(n){ return (n<10?"0":"")+n; }
function todayStr(){ var d=new Date(); return ""+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }
function nowHHmm(){ var d=new Date(); return pad2(d.getHours())+pad2(d.getMinutes()); }
function dateInputToYyyymmdd(v){ if(!v) return ""; return v.replace(/-/g,""); }
function ageFromDob(dob){
  if(!dob) return null;
  var b = new Date(dob);
  var t = new Date();
  var age = t.getFullYear()-b.getFullYear();
  var m = t.getMonth()-b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) age--;
  return age;
}
function up(s){ return (s||"").toString().trim().toUpperCase(); }

/* ---------- App state ---------- */
var state = { view:"home" };
var el = document.getElementById("app");

function go(view, extra){
  state = Object.assign({view:view}, extra||{});
  render();
  window.scrollTo(0,0);
}

/* ---------- Render router ---------- */
function render(){
  if(state.view==="home") return renderHome();
  if(state.view==="guestJoin") return renderGuestJoin();
  if(state.view==="guestForm") return renderGuestForm();
  if(state.view==="adminLogin") return renderAdminLogin();
  if(state.view==="adminHome") return renderAdminHome();
  if(state.view==="adminNew") return renderAdminNew();
  if(state.view==="adminDetail") return renderAdminDetail();
  if(state.view==="adminGuestEdit") return renderAdminGuestEdit();
  if(state.view==="adminSettings") return renderAdminSettings();
}

function bindNav(){

/* ---------- GUEST: status + form, merged on one page, always shown at the link ---------- */
function renderGuestForm(){
  var code = state.code;
  var lang = state.lang || "ca";
  el.innerHTML = '<div class="eyebrow">El Molí de Fornells</div><p class="muted">'+I18N[lang].loading+'</p>';
  Promise.all([sget("reserva:"+code+":meta"), slist("reserva:"+code+":guest:")]).then(function(res){
    var meta = res[0] && res[0].value ? JSON.parse(res[0].value) : null;
    if(!meta){
      el.innerHTML = '<div class="eyebrow">El Molí de Fornells</div><div class="card"><div class="error">'+I18N[lang].notFound+'</div></div>';
      return;
    }
    var keys = res[1].keys || [];
    Promise.all(keys.map(function(k){ return sget(k).then(function(r){ return r? JSON.parse(r.value): null; }); })).then(function(guests){
      guests = guests.filter(Boolean);
      renderGuestFormBody(code, meta, guests, lang, state.formTmp||{}, state.justSubmitted);
      state.justSubmitted = false;
    });
  });
}

    else { lbl.textContent=t.numdocO+" *"; passWrap.style.display="none"; supportWrap.style.display="none"; lblCog2.textContent=t.cog2opt; }
  }
  function syncAddr(){

    if(!data.tel) errs.push(t.errTel);

      });
    });
  });

/* ---------- Validation / export ---------- */
function missingFields(g, meta){
  var out = [];
  if(!g.dob) out.push("data de naixement");
  if(g.tipdoc==="D" && !g.cog2) out.push("segon cognom");
  if((g.tipdoc==="D"||g.tipdoc==="N") && (!g.suport || g.suport.length!==9)) out.push("número de suport (9 caràcters)");
  var age = ageFromDob(g.dob);
  if(age!==null && age<18 && !g.parentesc) out.push("relació de parentesc (menor d'edat)");
  if(!g.tel) out.push("telèfon");
  if(!g.email) out.push("correu electrònic");
  if(!g.adreca) out.push("adreça");
  if(g.paisres==="ESP" && (!g.provincia || !g.municipi)) out.push("província/municipi");
  if(g.paisres!=="ESP" && !g.localitat) out.push("localitat");
  if(!g.cp) out.push("codi postal");
  return out;
}

function docLabel(t){ var f = TIPUS_DOC.filter(function(x){return x[0]===t;})[0]; return f?f[1]:t; }

function buildTxt(settings, meta, guestList){
  var lines = [];
  var count = guestList.length;
  // Línia establiment (registre tipus 1)
  var lineEst = ["1", up(settings.idPolicial).slice(0,10), ESTABLISHMENT_NAME.slice(0,40), todayStr(), nowHHmm(), String(count), "V24"];
  lines.push(lineEst.join("|"));

  guestList.forEach(function(g){
    var isSpanishDoc = g.tipdoc==="D" || (g.tipdoc==="P" && g.passOrigin!=="foreign");
    var numEsp = isSpanishDoc ? up(g.numdoc) : "";
    var numExt = !isSpanishDoc ? up(g.numdoc) : "";
    var fields = [
      "2",
      numEsp,
      numExt,
      g.tipdoc||"",
      dateInputToYyyymmdd(g.dataexp),
      up(g.cog1),
      up(g.cog2),
      up(g.nom),
      g.sexe||"",
      dateInputToYyyymmdd(g.dob),
      g.nac||"",
      meta.dataEntrada||"",
      meta.horaEntrada||"",
      meta.dataSortida||"",
      meta.horaSortida||"",
      meta.dataContracte||"",
      meta.tipusContracte||"",
      meta.numContracte||"",
      String(count),
      meta.numHabitacions||"",
      meta.disposaInternet||"",
      settings.tipusPagament||DEFAULT_TIPUS_PAGAMENT,
      g.tel||"",
      g.parentesc||"",
      g.email||"",
      (g.tipdoc==="D"||g.tipdoc==="N") ? up(g.suport) : "",
      up(g.adreca),
      g.paisres==="ESP" ? (g.provincia||"") : "",
      "",
      g.paisres==="ESP" ? up(g.municipi) : up(g.localitat),
      g.paisres||"",
      up(g.cp)
    ];
    lines.push(fields.join("|")+"|");
  });
  return lines.join("\r\n");
}

function downloadTxt(filename, content){
  var blob = new Blob([content], {type:"text/plain;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* ---------- small render utils ---------- */
function esc(s){ return (s===undefined||s===null) ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function select(id, options, selected){
  return '<select id="'+id+'">'+options.map(function(o){
    return '<option value="'+o[0]+'"'+(o[0]===selected?" selected":"")+'>'+esc(o[1])+'</option>';
  }).join("")+'</select>';
}
function backRow(target){
  return '<div class="backrow"><button data-go="'+target+'" aria-label="Enrere">←</button><span class="muted">Enrere</span></div>';
}
function fmtDate(yyyymmdd){
  if(!yyyymmdd || yyyymmdd.length!==8) return "—";
  return yyyymmdd.slice(6,8)+"/"+yyyymmdd.slice(4,6)+"/"+yyyymmdd.slice(0,4);
}
function fmtTime(hhmm){
  if(!hhmm || hhmm.length!==4) return "";
  return hhmm.slice(0,2)+":"+hhmm.slice(2,4);
}

/* ---------- boot ---------- */
window.addEventListener("unhandledrejection", function(ev){
  if(ev && ev.reason && ev.reason.message === "STORAGE_UNAVAILABLE"){
    var banner = document.createElement("div");
    banner.className = "error";
    banner.style.margin = "16px";
    banner.textContent = STORAGE_HELP;
    document.body.insertBefore(banner, document.body.firstChild);
    ev.preventDefault();
  }
});
(function initFromUrl(){
  try{
    var params = new URLSearchParams(window.location.search);
    var r = (params.get("r")||"").trim().toUpperCase();
    if(r){ state = { view:"guestForm", code:r }; }
  }catch(e){}
  render();
})();
})();
</script>

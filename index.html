<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Registre de viatgers — El Molí de Fornells</title>
<style>
  :root{
    --paper:#EEF0E4;
    --paper-line:#DCDFCC;
    --ink:#232922;
    --ink-soft:#5B6355;
    --forest:#2E3B27;
    --rust:#A6521B;
    --rust-dark:#853E14;
    --gold:#C99A2E;
    --warn:#8B3A2A;
    --warn-bg:#F3E3DC;
    --ok:#3B6B44;
    --ok-bg:#E1EADD;
    --card:#F7F8F0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px),
      var(--paper);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
  }
  #app{max-width:560px;margin:0 auto;padding:18px 16px 60px;}
  h1,h2,h3{font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;color:var(--forest);}
  h1{font-size:22px;margin:4px 0 2px;letter-spacing:.2px;}
  .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:20px;margin-top:16px;box-shadow:0 1px 0 rgba(0,0,0,.03);}
  .muted{color:var(--ink-soft);font-size:13px;}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;color:var(--forest);}
  label .opt{font-weight:400;color:var(--ink-soft);}
  input,select,textarea{
    width:100%;padding:10px 11px;border:1px solid #C7CBB6;border-radius:7px;
    font-size:15px;background:#fff;color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{
    display:inline-block;width:100%;text-align:center;padding:12px 16px;border-radius:8px;border:none;
    font-size:15px;font-weight:700;cursor:pointer;margin-top:18px;font-family:inherit;
  }
  .btn-primary{background:var(--rust);color:#fff;}
  .btn-primary:hover{background:var(--rust-dark);}
  .btn-secondary{background:transparent;color:var(--forest);border:1.5px solid var(--forest);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--paper-line);font-weight:500;font-size:13px;padding:8px 12px;width:auto;margin-top:8px;}
  .btn-danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn);}
  .link-btn{background:none;border:none;color:var(--rust);font-weight:600;cursor:pointer;padding:0;font-size:14px;text-decoration:underline;}
  .home-choice{
    display:block;width:100%;text-align:left;padding:18px;border-radius:var(--radius);
    border:1.5px solid var(--paper-line);background:var(--card);cursor:pointer;margin-top:14px;
  }
  .home-choice:hover{border-color:var(--rust);}
  .home-choice h3{margin:0 0 4px;font-size:17px;}
  .home-choice p{margin:0;color:var(--ink-soft);font-size:13px;}
  .error{background:var(--warn-bg);color:var(--warn-dark,#6b2b1f);border:1px solid #E0BBAC;padding:10px 12px;border-radius:7px;font-size:13.5px;margin-top:12px;}
  .success{background:var(--ok-bg);color:var(--ok);border:1px solid #BCD6C0;padding:10px 12px;border-radius:7px;font-size:13.5px;margin-top:12px;}
  .stamp{
    width:112px;height:112px;border-radius:50%;border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    margin:18px auto 8px;transform:rotate(-6deg);color:var(--gold);text-align:center;
    font-family:Georgia,serif;
  }
  .stamp .code{font-size:20px;font-weight:700;letter-spacing:2px;color:var(--forest);}
  .stamp .lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
  .backrow{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .backrow button{background:none;border:none;color:var(--ink-soft);font-size:20px;cursor:pointer;padding:0 4px 0 0;}
  fieldset{border:1px solid var(--paper-line);border-radius:8px;padding:6px 14px 14px;margin-top:18px;}
  legend{font-family:Georgia,serif;color:var(--forest);font-weight:700;font-size:14px;padding:0 6px;}
  .guest-row{border:1px solid var(--paper-line);border-radius:8px;padding:10px 12px;margin-top:10px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .guest-row .name{font-weight:600;font-size:14.5px;}
  .guest-row .meta{font-size:12px;color:var(--ink-soft);}
  .pill{display:inline-block;background:var(--warn-bg);color:var(--warn);font-size:11px;padding:2px 7px;border-radius:20px;margin-left:6px;font-weight:600;}
  .res-row{border:1px solid var(--paper-line);border-radius:8px;padding:12px 14px;margin-top:10px;background:#fff;cursor:pointer;}
  .res-row:hover{border-color:var(--rust);}
  .res-row .code{font-family:Georgia,serif;font-weight:700;color:var(--forest);font-size:15px;letter-spacing:1px;}
  .checklist{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--warn);}
  .footer-note{margin-top:26px;font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.5;}
  .toggle-row{display:flex;gap:10px;margin-top:6px;}
  .toggle-row button{flex:1;padding:9px;border-radius:7px;border:1.5px solid #C7CBB6;background:#fff;font-weight:600;cursor:pointer;font-size:14px;}
  .toggle-row button.active{background:var(--forest);color:#fff;border-color:var(--forest);}
  code.mono{background:#e9e6d6;padding:1px 5px;border-radius:4px;font-size:12.5px;}
  .hint{font-size:12.5px;color:var(--ink-soft);margin:2px 0 6px;line-height:1.45;}
  .notice{background:#FBF6E9;color:#6B4E10;border:1px solid #E6D3A3;padding:8px 10px;border-radius:7px;font-size:13px;margin-top:8px;}
  input.invalid{border-color:var(--warn);background:var(--warn-bg);}
  #under14Note{background:var(--ok-bg);color:var(--ok);border-radius:7px;padding:8px 10px;margin-top:8px;}
</style>
</head>

var SUPABASE_URL = "https://xfrvlapbnfpymjgmxfeq.supabase.co";

function storageReady(){ return /^https?:\/\//.test(SUPABASE_URL) && SUPABASE_PUBLISHABLE_KEY.length > 10; }
function storageMissingError(){ return Promise.reject(new Error("STORAGE_UNAVAILABLE")); }
function sbHeaders(extra){
  var h = { "apikey": SUPABASE_PUBLISHABLE_KEY, "Authorization": "Bearer "+SUPABASE_PUBLISHABLE_KEY, "Content-Type":"application/json" };
  if(extra){ for(var k in extra){ h[k]=extra[k]; } }
  return h;
}
function sbFetch(url, opts){
  return fetch(url, opts).then(function(r){
    if(!r.ok) throw new Error("STORAGE_UNAVAILABLE");
    return r.text().then(function(text){
      if(!text) return null;
      try{ return JSON.parse(text); }catch(e){ return null; }
    });
  }, function(){ throw new Error("STORAGE_UNAVAILABLE"); });
}
function sget(key){
  if(!storageReady()) return storageMissingError();
  var url = SUPABASE_URL+"/rest/v1/kv_store?key=eq."+encodeURIComponent(key)+"&select=value";
  return sbFetch(url, { headers: sbHeaders() }).then(function(rows){
    if(!rows || !rows.length) return null;
    return { key:key, value: rows[0].value };
  }).catch(function(e){ if(e && e.message==="STORAGE_UNAVAILABLE") throw e; return null; });
}
function sset(key, val){
  if(!storageReady()) return storageMissingError();
  var url = SUPABASE_URL+"/rest/v1/kv_store";
  return sbFetch(url, {
    method:"POST",
    headers: sbHeaders({ "Prefer":"resolution=merge-duplicates" }),
    body: JSON.stringify([{ key:key, value: val }])
  }).then(function(){ return { key:key, value:val }; });
}
function sdel(key){
  if(!storageReady()) return storageMissingError();
  var url = SUPABASE_URL+"/rest/v1/kv_store?key=eq."+encodeURIComponent(key);
  return sbFetch(url, { method:"DELETE", headers: sbHeaders() }).then(function(){ return { key:key, deleted:true }; })
    .catch(function(e){ if(e && e.message==="STORAGE_UNAVAILABLE") throw e; return null; });
}
function slist(prefix){
  if(!storageReady()) return storageMissingError();
  var url = SUPABASE_URL+"/rest/v1/kv_store?key=like."+encodeURIComponent(prefix||"")+"*&select=key";
  return sbFetch(url, { headers: sbHeaders() }).then(function(rows){
    return { keys: (rows||[]).map(function(x){ return x.key; }) };
  }).catch(function(e){ if(e && e.message==="STORAGE_UNAVAILABLE") throw e; return {keys:[]}; });
}

function codeGen(){
  var chars = "ACDEFGHJKLMNPQRSTUVWXYZ23456789"; // sense O/0/I/1 per evitar confusions
  var out = "";
  for(var i=0;i<5;i++){ out += chars[Math.floor(Math.random()*chars.length)]; }
  return out;
}

function pad2(n){ return (n<10?"0":"")+n; }
function todayStr(){ var d=new Date(); return ""+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }
function nowHHmm(){ var d=new Date(); return pad2(d.getHours())+pad2(d.getMinutes()); }
function dateInputToYyyymmdd(v){ if(!v) return ""; return v.replace(/-/g,""); }
function ageFromDob(dob){
  if(!dob) return null;
  var b = new Date(dob);
  var t = new Date();
  var age = t.getFullYear()-b.getFullYear();
  var m = t.getMonth()-b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) age--;
  return age;
}
function up(s){ return (s||"").toString().trim().toUpperCase(); }

function go(view, extra){
  state = Object.assign({view:view}, extra||{});
  render();
  window.scrollTo(0,0);
}

/* ---------- Render router ---------- */

  if(state.view==="home") return renderHome();

  if(state.view==="adminDetail") return renderAdminDetail();
  if(state.view==="adminGuestEdit") return renderAdminGuestEdit();
  if(state.view==="adminSettings") return renderAdminSettings();
}

/* ---------- Helpers: països, municipis, normalització i validació ---------- */
function normSearch(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
var _countryCache = {};
function countryOptions(lang){
  if(_countryCache[lang]) return _countryCache[lang];
  var dn = null;
  try{ dn = new Intl.DisplayNames([lang], {type:"region"}); }catch(e){ dn = null; }
  var list = ISO_COUNTRIES.map(function(c){
    var n = c[2];
    if(dn){ try{ n = dn.of(c[1]) || n; }catch(e){} }
    return [c[0], n];
  });
  list.sort(function(a,b){ return a[1].localeCompare(b[1], lang); });
  var esp = list.filter(function(x){ return x[0]==="ESP"; });
  list = esp.concat(list.filter(function(x){ return x[0]!=="ESP"; }));
  _countryCache[lang] = list;
  return list;
}
function isValidCountry(a3){ return ISO_COUNTRIES.some(function(c){ return c[0]===a3; }); }
var _muniCache = {};
function munisFor(prov){
  if(!prov || !MUNIS[prov]) return [];
  if(_muniCache[prov]) return _muniCache[prov];
  var list = MUNIS[prov].split("|").map(function(e){ return [prov+e.slice(0,4), e.slice(4)]; });
  list.sort(function(a,b){ return a[1].localeCompare(b[1], "ca"); });
  _muniCache[prov] = list;
  return list;
}
function muniName(code){
  if(!code || code.length!==6) return "";
  var m = munisFor(code.slice(0,2)).filter(function(x){ return x[0]===code; })[0];
  return m ? m[1] : "";
}

// Text per al fitxer: majúscules, sense separadors "|", salts de línia ni símbols º/ª
function cleanTxt(s){ return up(s).replace(/[|\r\n\t]/g," ").replace(/[ºª°]/g," ").replace(/\s+/g," ").trim(); }
function noPipe(s){ return (s||"").toString().replace(/[|\r\n\t]/g," ").trim(); }
function cleanDoc(s){ return (s||"").toString().toUpperCase().replace(/[\s\-\.\/]/g,""); }

var DNI_LETTERS = "TRWAGMYFPDXBNJZSQVHLCKE";
// Retorna {value, err}. err: null | "fmtD" | "fmtN" | "letter" | "looksNie"
function checkDocNumber(tip, raw){
  var n = cleanDoc(raw);
  if(tip==="D"){
    if(/^[XYZ]/.test(n)) return {value:n, err:"looksNie"};
    if(/^[0-9]{7}[A-Z]$/.test(n)) n = "0"+n;
    if(!/^[0-9]{8}[A-Z]$/.test(n)) return {value:n, err:"fmtD"};
    if(DNI_LETTERS[parseInt(n.slice(0,8),10)%23]!==n[8]) return {value:n, err:"letter"};
  } else if(tip==="N"){
    if(!/^[XYZ][0-9]{7}[A-Z]$/.test(n)) return {value:n, err:"fmtN"};
    var num = {X:"0",Y:"1",Z:"2"}[n[0]] + n.slice(1,8);
    if(DNI_LETTERS[parseInt(num,10)%23]!==n[8]) return {value:n, err:"letter"};
  }
  return {value:n, err:null};
}

// Número de suport. DNI/NIF: 3 lletres + 6 números. NIE/TIE: E + 8 números.
// Corregeix automàticament les confusions evidents (0/O, I/1) segons la posició.
// Retorna {value, corrected, err}. err: null | "len" | "letters" | "digits" | "nie"
function normSupport(tip, raw){
  var orig = cleanDoc(raw);
  var s = orig;
  if(tip==="D"){
    if(s.length===9){
      s = s.slice(0,3).replace(/0/g,"O").replace(/1/g,"I") + s.slice(3).replace(/O/g,"0").replace(/[IL]/g,"1");
    }
    var err = null;
    if(s.length!==9) err = "len";
    else if(!/^[A-Z]{3}$/.test(s.slice(0,3))) err = "letters";
    else if(!/^[0-9]{6}$/.test(s.slice(3))) err = "digits";
    return {value:s, corrected: s!==orig && !err, err:err};
  }
  if(tip==="N"){
    if(s.length>=2 && s[0]==="E"){
      var digits = s.slice(1).replace(/O/g,"0").replace(/[IL]/g,"1");
      if(/^[0-9]{1,8}$/.test(digits)) digits = ("00000000"+digits).slice(-8);
      s = "E"+digits;
    }
    var errN = /^E[0-9]{8}$/.test(s) ? null : "nie";
    return {value:s, corrected: s!==orig && !errN, err:errN};
  }
  return {value:s, corrected:false, err:null};
}
function supportErrorText(t, tip, res){
  var detail;
  if(res.err==="len") detail = t.errSupLen(res.value.length);
  else if(res.err==="letters") detail = t.errSupLetters;
  else if(res.err==="digits") detail = t.errSupDigits;
  else detail = t.errSupNie;
  return t.errSupport+" "+detail+(res.value ? " ("+t.youWrote+" "+res.value+")" : "");
}
function docErrorText(t, err){
  return {fmtD:t.errDocFmtD, fmtN:t.errDocFmtN, letter:t.errDocLetter, looksNie:t.errDocLooksNie}[err] || "";
}
function needsDoc(age){ return age===null || age>=14; }

function bindMuniWidget(p, f, t){
  var prov = document.getElementById(p+"_provincia");
  var filt = document.getElementById(p+"_muniFilter");
  var sel = document.getElementById(p+"_municode");
  var otherWrap = document.getElementById(p+"_muniOtherWrap");
  var current = f.muniAltre ? "__ALTRE__" : (f.municipiCode||"");
  if(!current && f.municipi && !f.muniAltre){ filt.value = f.municipi; }
  function rebuild(){
    var list = munisFor(prov.value);
    var q = normSearch(filt.value);
    var matches = list.filter(function(m){ return !q || normSearch(m[1]).indexOf(q)>=0; });
    if(q && matches.length===1 && !current){ current = matches[0][0]; }
    var html = '<option value="">'+esc(prov.value ? t.muniChoose : t.muniPickProv)+'</option>';
    var shown = {};
    matches.forEach(function(m){ shown[m[0]]=1; html += '<option value="'+m[0]+'"'+(m[0]===current?' selected':'')+'>'+esc(m[1])+'</option>'; });
    if(current && current!=="__ALTRE__" && !shown[current] && current.slice(0,2)===prov.value){
      html += '<option value="'+current+'" selected>'+esc(muniName(current))+'</option>';
    }
    if(prov.value) html += '<option value="__ALTRE__"'+(current==="__ALTRE__"?' selected':'')+'>'+esc(t.muniNotListed)+'</option>';
    sel.innerHTML = html;
    otherWrap.style.display = sel.value==="__ALTRE__" ? "block" : "none";
  }
  prov.addEventListener("change", function(){ current = ""; filt.value = ""; rebuild(); });
  filt.addEventListener("input", function(){ if(current && current!=="__ALTRE__") current = ""; rebuild(); });
  sel.addEventListener("change", function(){ current = sel.value; otherWrap.style.display = current==="__ALTRE__" ? "block" : "none"; });
  rebuild();
}
function readMuni(p){
  var prov = v(p+"_provincia");
  var code = v(p+"_municode");
  if(code==="__ALTRE__"){
    var ine = document.getElementById(p+"_inecode") ? v(p+"_inecode") : "";
    return {provincia:prov, municipiCode:ine, municipi:v(p+"_municipiOther"), muniAltre:true};
  }
  if(code) return {provincia:prov, municipiCode:code, municipi:muniName(code), muniAltre:false};
  return {provincia:prov, municipiCode:"", municipi:"", muniAltre:false};
}

/* ---------- Validació comuna (formulari de l'hoste i panell del gestor) ---------- */
function isoToday(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function validateGuest(d, t){
  var errs = [];
  var age = ageFromDob(d.dob);
  if(!d.nom) errs.push(t.errNom);
  if(!d.cog1) errs.push(t.errCog1);
  if(!d.dob) errs.push(t.errDob);
  else if(d.dob > isoToday()) errs.push(t.errDobFuture);
  var docReq = needsDoc(age);
  var hasDoc = !!cleanDoc(d.numdoc);
  if(docReq && !hasDoc) errs.push(t.errNumdoc);
  if(hasDoc){
    var dc = checkDocNumber(d.tipdoc, d.numdoc);
    if(dc.err) errs.push(docErrorText(t, dc.err));
    if(d.tipdoc==="D" || d.tipdoc==="N"){
      var sr = normSupport(d.tipdoc, d.suport);
      if(sr.err) errs.push(supportErrorText(t, d.tipdoc, sr));
    }
    if(d.tipdoc==="D" && !d.cog2) errs.push(t.errCog2);
  }
  if(!d.tel) errs.push(t.errTel);
  if(!d.email) errs.push(t.errEmail);
  else if(!/^[^\s@|]+@[^\s@|]+\.[^\s@|]+$/.test(d.email)) errs.push(t.errEmailFmt);
  if(age!==null && age<18 && !d.parentesc) errs.push(t.errParentesc);
  if(!d.adreca) errs.push(t.errAdreca);
  if(d.paisres==="ESP"){
    if(!d.provincia) errs.push(t.errProv);
    else if(d.muniAltre){ if(!d.municipi) errs.push(t.errMuniOther); }
    else if(!/^[0-9]{6}$/.test(d.municipiCode||"")) errs.push(t.errMuni);
    var cp = (d.cp||"").replace(/\s/g,"");
    if(!cp) errs.push(t.errCp);
    else if(!/^[0-9]{5}$/.test(cp)) errs.push(t.errCpFmt);
    else if(d.provincia && cp.slice(0,2)!==d.provincia) errs.push(t.errCpProv);
  } else {
    if(!d.localitat) errs.push(t.errLocalitat);
    if(!d.cp) errs.push(t.errCp);
  }
  return errs;
}
// Deixa les dades en el format net que s'enviarà (document, suport i CP)
function normalizeGuest(d){
  var out = Object.assign({}, d);
  if(cleanDoc(out.numdoc)) out.numdoc = checkDocNumber(out.tipdoc, out.numdoc).value; else out.numdoc = "";
  if(out.tipdoc==="D" || out.tipdoc==="N"){ out.suport = out.suport ? normSupport(out.tipdoc, out.suport).value : ""; }
  else out.suport = "";
  if(out.paisres==="ESP") out.cp = (out.cp||"").replace(/\s/g,"");
  return out;
}

/* ---------- ADMIN: reservation detail ---------- */
function renderAdminDetail(){
  var code = state.code;
  el.innerHTML = backRow("adminHome") + '<h1>Reserva</h1><div id="detailBody" class="muted">Carregant…</div>';
  bindNav();

  Promise.all([sget("reserva:"+code+":meta"), slist("reserva:"+code+":guest:"), getSettings()]).then(function(res){
    var meta = res[0] && res[0].value ? JSON.parse(res[0].value) : null;
    if(!meta){ document.getElementById("detailBody").innerHTML = '<div class="error">Reserva no trobada.</div>'; return; }
    var settings = res[2];
    var keys = res[1].keys || [];
    Promise.all(keys.map(function(k){ return sget(k).then(function(r){ return {key:k, data: r? JSON.parse(r.value): null}; }); })).then(function(guests){
      guests = guests.filter(function(g){ return g.data; });
      var justCreated = state.justCreated;
      var shareLink = settings.publicBaseUrl
        ? settings.publicBaseUrl + "?r=" + code
        : (window.location.origin + window.location.pathname + "?r=" + code);
      var missingUrlWarning = settings.publicBaseUrl ? "" :
        '<div class="error">Encara no has desat l\'enllaç públic de l\'eina a Configuració, així que aquest enllaç pot no funcionar per als hostes. <button class="link-btn" id="goToSettingsBtn">Ves a Configuració</button></div>';
      var body =
        (justCreated ? '<div class="stamp"><div class="code">'+code+'</div><div class="lbl">Codi de reserva</div></div>' : '')+
        '<div class="card">'+
          '<label>Enllaç per als hostes</label>'+
          '<input id="shareLinkInput" readonly value="'+esc(shareLink)+'" onclick="this.select()">'+
          '<button class="btn btn-secondary" id="copyLinkBtn">Copiar enllaç</button>'+
          missingUrlWarning+
          '<p class="muted">Envia aquest enllaç a tots els hostes de la reserva (per WhatsApp, per exemple). En obrir-lo aniran directes al formulari, amb l\'idioma que triïn i veient quantes persones falten per registrar-se.</p>'+
        '</div>'+
        '<div class="card">'+
          '<p class="muted" style="margin-top:0;">Reserva de <strong>'+esc(meta.nomTitular)+'</strong><br>'+fmtDate(meta.dataEntrada)+' (16:00) → '+fmtDate(meta.dataSortida)+' (11:00)</p>'+
          '<h3 style="margin-bottom:6px;">Hostes registrats ('+guests.length+' de '+esc(meta.numPersones||"?")+' esperats)</h3>'+
          (guests.length? guests.map(function(g){
            var missing = missingFields(g.data, meta);
            return '<div class="guest-row">'+
              '<div><div class="name">'+esc(g.data.nom)+' '+esc(g.data.cog1)+' '+esc(g.data.cog2)+(missing.length? '<span class="pill">'+missing.length+' camp(s) a revisar</span>':'')+'</div>'+
              '<div class="meta">'+docLabel(g.data.tipdoc)+' '+esc(g.data.numdoc)+'</div></div>'+
              '<button class="link-btn" data-guest="'+g.key+'">Editar</button>'+
            '</div>';
          }).join("") : '<p class="muted">Encara ningú s\'ha registrat amb aquest codi.</p>')+
          '<button class="btn btn-primary" id="dlBtn" '+(guests.length?"":"disabled")+'>Descarregar fitxer .txt</button>'+
          '<div id="dlWarn"></div>'+
          '<button class="btn btn-danger" id="delBtn">Esborrar aquesta reserva</button>'+
        '</div>';
      document.getElementById("detailBody").innerHTML = body;
      if(document.getElementById("goToSettingsBtn")){
        document.getElementById("goToSettingsBtn").addEventListener("click", function(){ go("adminSettings"); });
      }
      document.getElementById("copyLinkBtn").addEventListener("click", function(){
        var input = document.getElementById("shareLinkInput");
        input.select();
        var btn = this;
        (navigator.clipboard && navigator.clipboard.writeText
          ? navigator.clipboard.writeText(shareLink)
          : Promise.reject()
        ).then(function(){ btn.textContent = "Enllaç copiat ✓"; })
         .catch(function(){ document.execCommand("copy"); btn.textContent = "Enllaç copiat ✓"; });
      });

      document.querySelectorAll("[data-guest]").forEach(function(b){
        b.addEventListener("click", function(){ go("adminGuestEdit", { code: code, guestKey: b.getAttribute("data-guest") }); });
      });

      document.getElementById("dlBtn").addEventListener("click", function(){
        getSettings().then(function(settings){
          var idErr = idPolicialError(normIdPolicial(settings.idPolicial));
          if(idErr){
            document.getElementById("dlWarn").innerHTML = '<div class="error">Configuració: '+esc(idErr)+' Ves a Configuració per corregir-ho.</div>';
            return;
          }
          var allWarnings = [];
          guests.forEach(function(g){
            var m = missingFields(g.data, meta);
            if(m.length) allWarnings.push((g.data.nom+" "+g.data.cog1)+": "+m.join(" "));
          });
          if(meta.numPersones && guests.length < Number(meta.numPersones)){
            allWarnings.unshift("Encara falten "+(Number(meta.numPersones)-guests.length)+" hoste(s) per registrar-se (esperats: "+meta.numPersones+").");
          }
          var txt = buildTxt(settings, meta, guests.map(function(g){return g.data;}));
          downloadTxt(normIdPolicial(settings.idPolicial)+"_"+code+".txt", txt);
          document.getElementById("dlWarn").innerHTML = allWarnings.length
            ? '<div class="error">Fitxer descarregat. Revisa això abans d\'enviar-lo:<ul class="checklist">'+allWarnings.map(function(w){return "<li>"+esc(w)+"</li>";}).join("")+'</ul></div>'
            : '<div class="success">Fitxer descarregat correctament, sense avisos.</div>';
        });
      });

      document.getElementById("delBtn").addEventListener("click", function(){
        if(!confirm("Segur que vols esborrar aquesta reserva i totes les dades dels hostes? Aquesta acció no es pot desfer.")) return;
        var btn = this;
        btn.disabled = true; btn.textContent = "Eliminant…";
        var dels = [sdel("reserva:"+code+":meta")].concat(keys.map(sdel));
        Promise.all(dels).then(function(){ go("adminHome"); }).catch(function(){
          btn.disabled = false; btn.textContent = "Esborrar aquesta reserva";
          document.getElementById("dlWarn").innerHTML = '<div class="error">'+STORAGE_HELP+'</div>';
        });
      });
    });
  });
}

  if(/[\s\-\/\.]/.test(id)) return "Aquest no sembla l'identificador policial: no porta guions, punts ni espais. Comprova que no hagis posat el número de llicència de turisme (NIRTC).";
  if(!/^[A-Z0-9]{9,10}$/.test(id)) return "L'identificador policial ha de tenir 9 o 10 caràcters, només lletres i números (ex. 17XXXAAR01).";
  return null;
}

/* ---------- Validation / export ---------- */
// Llista d'avisos per al gestor: mateixes regles que el formulari de l'hoste + comprovacions del fitxer
function missingFields(g){
  var out = validateGuest(g, I18N.ca);
  if(g.paisres && !isValidCountry(g.paisres)) out.push("El país de residència no té un codi ISO vàlid: torna'l a triar.");
  if(g.paisres==="ESP" && g.muniAltre && !/^[0-9]{6}$/.test(g.municipiCode||"")){
    out.push("Falta el codi INE del municipi «"+(g.municipi||"?")+"» (l'hoste no l'ha trobat a la llista): introdueix-lo a l'edició.");
  }
  if(g.paisres==="ESP" && /^[0-9]{6}$/.test(g.municipiCode||"") && g.provincia && g.municipiCode.slice(0,2)!==g.provincia){
    out.push("El codi INE del municipi no correspon a la província triada.");
  }
  return out;
}

function docLabel(t){ var f = TIPUS_DOC.filter(function(x){return x[0]===t;})[0]; return f?f[1]:t; }

function buildTxt(settings, meta, guestList){
  var lines = [];
  var count = guestList.length;
  // Línia establiment (registre tipus 1)
  var lineEst = ["1", normIdPolicial(settings.idPolicial).slice(0,10), ESTABLISHMENT_NAME.slice(0,40), todayStr(), nowHHmm(), String(count), "V24"];
  lines.push(lineEst.join("|"));

  guestList.forEach(function(raw){
    var g = normalizeGuest(raw);
    var hasDoc = !!g.numdoc;
    var tip = hasDoc ? (g.tipdoc||"") : "";
    var isSpanishDoc = tip==="D" || (tip==="P" && g.passOrigin!=="foreign");
    var age = ageFromDob(g.dob);
    var esp = g.paisres==="ESP";
    var fields = [
      "2",                                                        // 1 tipus registre
      hasDoc && isSpanishDoc ? g.numdoc : "",                     // 2 document espanyol
      hasDoc && !isSpanishDoc ? g.numdoc : "",                    // 3 document estranger
      tip,                                                        // 4 tipus document
      dateInputToYyyymmdd(g.dataexp),                             // 5 data expedició
      cleanTxt(g.cog1).slice(0,30),                               // 6
      cleanTxt(g.cog2).slice(0,30),                               // 7
      cleanTxt(g.nom).slice(0,30),                                // 8
      g.sexe||"",                                                 // 9
      dateInputToYyyymmdd(g.dob),                                 // 10
      g.nac||"",                                                  // 11 nacionalitat ISO-3
      meta.dataEntrada||"",                                       // 12
      meta.horaEntrada||"",                                       // 13
      meta.dataSortida||"",                                       // 14
      meta.horaSortida||"",                                       // 15
      meta.dataContracte||"",                                     // 16
      meta.tipusContracte||"",                                    // 17
      meta.numContracte||"",                                      // 18
      String(count),                                              // 19
      meta.numHabitacions||"",                                    // 20
      settings.internet||"",                                      // 21
      settings.tipusPagament||DEFAULT_TIPUS_PAGAMENT,             // 22
      noPipe(g.tel).slice(0,20),                                  // 23
      (age!==null && age<18) ? (g.parentesc||"") : "",            // 24
      noPipe(g.email).slice(0,100),                               // 25
      (tip==="D"||tip==="N") ? g.suport : "",                     // 26 número de suport
      cleanTxt(g.adreca).slice(0,100),                            // 27
      esp ? (g.provincia||"") : "",                               // 28 província INE (2)
      esp ? (g.municipiCode||"") : "",                            // 29 municipi INE (6)
      esp ? "" : cleanTxt(g.localitat).slice(0,100),              // 30 localitat
      g.paisres||"",                                              // 31
      (esp ? g.cp : up(noPipe(g.cp))).slice(0,20)                 // 32
    ];
    lines.push(fields.join("|")+"|");
  });
  return lines.join("\r\n");
}

function downloadTxt(filename, content){
  var blob = new Blob([content], {type:"text/plain;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}


/* ---------- small render utils ---------- */
function esc(s){ return (s===undefined||s===null) ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function select(id, options, selected){
  return '<select id="'+id+'">'+options.map(function(o){
    return '<option value="'+o[0]+'"'+(o[0]===selected?" selected":"")+'>'+esc(o[1])+'</option>';
  }).join("")+'</select>';
}
function backRow(target){
  return '<div class="backrow"><button data-go="'+target+'" aria-label="Enrere">←</button><span class="muted">Enrere</span></div>';
}
function fmtDate(yyyymmdd){
  if(!yyyymmdd || yyyymmdd.length!==8) return "—";
  return yyyymmdd.slice(6,8)+"/"+yyyymmdd.slice(4,6)+"/"+yyyymmdd.slice(0,4);
}
function fmtTime(hhmm){
  if(!hhmm || hhmm.length!==4) return "";
  return hhmm.slice(0,2)+":"+hhmm.slice(2,4);
}

/* ---------- boot ---------- */
window.addEventListener("unhandledrejection", function(ev){
  if(ev && ev.reason && ev.reason.message === "STORAGE_UNAVAILABLE"){
    var banner = document.createElement("div");
    banner.className = "error";
    banner.style.margin = "16px";
    banner.textContent = STORAGE_HELP;
    document.body.insertBefore(banner, document.body.firstChild);
    ev.preventDefault();
  }
});
(function initFromUrl(){
  try{
    var params = new URLSearchParams(window.location.search);
    var r = (params.get("r")||"").trim().toUpperCase();
    if(r){ state = { view:"guestForm", code:r }; }
  }catch(e){}
  render();
})();
})();
